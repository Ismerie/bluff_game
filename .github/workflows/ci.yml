name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Check formatting
        run: gdformat --check .

      - name: Lint
        run: gdlint .

  tests:
    name: Tests GUT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        env:
          GODOT_VERSION: "4.6"
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Run GUT tests
        run: |
          if [ -d "test" ]; then
            godot --headless -s res://addons/gut/gut_cmdln.gd \
              -gdir=res://test \
              -gprefix=test_ \
              -gsuffix=.gd \
              -gexit \
              -glog=1
          else
            echo "Aucun dossier test/ trouvé, étape ignorée"
          fi
